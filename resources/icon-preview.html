<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; background:#1e1e1e; color:#ccc; font:13px system-ui; padding:24px; }
  .row { display:flex; align-items:flex-end; gap:28px; margin-bottom:28px; }
  .cell { text-align:center; }
  .cell span { display:block; margin-top:8px; font-size:11px; color:#888; }
  .onlight { background:#fff; padding:20px; border-radius:8px; display:flex; gap:28px; align-items:flex-end; }
  .onlight span { color:#666; }
  img { display:block; image-rendering:auto; }
</style></head><body>
<div class="row">
  <div class="cell"><img src="icon-next.svg" width="256" height="256"><span>256</span></div>
  <div class="cell"><img src="icon-next.svg" width="128" height="128"><span>128</span></div>
  <div class="cell"><img src="icon-next.svg" width="64" height="64"><span>64</span></div>
  <div class="cell"><img src="icon-next.svg" width="32" height="32"><span>32</span></div>
  <div class="cell"><img src="icon-next.svg" width="16" height="16"><span>16</span></div>
</div>
<div class="onlight">
  <div class="cell"><img src="icon-next.svg" width="128" height="128"><span>浅色底</span></div>
  <div class="cell"><img src="icon-next.svg" width="32" height="32"><span>32</span></div>
</div>
</body></html>
